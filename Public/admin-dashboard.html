<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard – La Escuela del Espíritu Santo</title>

  <link rel="stylesheet" href="./admin.css" />
  <style>
    #searchInput { min-width: 240px; width: auto; }
    #pendingOnly { min-width: auto; width: auto; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>Admin Dashboard</h1>
        <div class="muted">Usuarios, pagos pendientes y acceso a módulos.</div>
        <div class="small" id="authStatus">Cargando sesión…</div>
        <div class="small" id="pendingSummary">Pagos pendientes: —</div>
      </div>

      <div class="row">
        <a class="btn btn-ghost" href="./admin-dashboard.html">Dashboard</a>
        <a class="btn btn-ghost" href="./admin-module.html">Módulos</a>
        <button class="btn btn-danger" id="logoutBtn" type="button">Cerrar sesión</button>
      </div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <div class="row">
          <label class="small" style="margin-right:6px;">Buscar:</label>
          <input id="searchInput" placeholder="email, nombre o WhatsApp..." />
          <label class="small" style="display:flex;gap:6px;align-items:center;">
            <input id="pendingOnly" type="checkbox" style="min-width:auto;width:auto;" />
            Solo pendientes
          </label>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Email</th>
            <th>Nombre</th>
            <th>WhatsApp / País</th>
            <th>Módulos pagados</th>
            <th>Tests aprobados</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <tr><td colspan="6">Cargando…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="./admin.js"></script>
</body>
</html>
