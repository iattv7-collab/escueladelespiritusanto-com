<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Módulos – La Escuela del Espíritu Santo</title>

  <link rel="stylesheet" href="./admin.css" />
  <style>
    .grid{
      display:grid;
      grid-template-columns: 200px 1fr 140px 140px 140px;
      gap:10px;
      align-items:end;
    }
    @media (max-width: 980px){ .grid{grid-template-columns:1fr 1fr;} }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>Módulos</h1>
        <div class="muted">Aquí creas y editas módulos. Luego entras a sus clases.</div>
        <div class="small" id="authStatus">Cargando sesión…</div>
      </div>

      <div class="row">
        <a class="btn btn-ghost" href="./admin-dashboard.html">Dashboard</a>
        <a class="btn btn-ghost" href="./admin-module.html">Módulos</a>
        <button class="btn btn-danger" id="logoutBtn" type="button">Cerrar sesión</button>
      </div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <div>
          <div class="small">Agregar / editar módulo</div>
        </div>
        <div class="small" id="statusMsg"></div>
      </div>

      <div class="grid" style="margin-top:10px;">
        <div>
          <label>ID módulo</label>
          <input id="moduleId" placeholder="1" />
        </div>
        <div>
          <label>Título</label>
          <input id="moduleTitle" placeholder="Módulo 1" />
        </div>
        <div>
          <label>Orden</label>
          <input id="moduleOrder" type="number" placeholder="1" />
        </div>
        <div>
          <label>Precio</label>
          <input id="modulePrice" type="number" placeholder="25" />
        </div>
        <div>
          <label>Activo</label>
          <select id="moduleActive">
            <option value="true">true</option>
            <option value="false">false</option>
          </select>
        </div>
      </div>

      <div class="row" style="margin-top:12px;">
        <button class="btn btn-primary" id="saveModuleBtn" type="button">Guardar módulo</button>
      </div>

      <div class="small" style="margin-top:10px;">
        Tip: si dejas el ID en blanco, se usará el “Orden” como ID.
      </div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <div>
          <div style="font-weight:700;">Lista de módulos</div>
          <div class="small">Usa “Ver clases” para entrar al módulo.</div>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Módulo</th>
            <th>Detalles</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="modulesTableBody">
          <tr><td colspan="3" class="small">Cargando…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="./admin.js"></script>
</body>
</html>
