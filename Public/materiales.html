<!-- Public/materiales.html -->
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Materiales – La Escuela del Espíritu Santo</title>

  <style>
    /* =========================
       BASE / RESET
    ========================= */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: linear-gradient(to bottom, #1e3a8a 0%, #3b82f6 40%, #93c5fd 100%);
      min-height: 100vh;
    }

    /* =========================
       PAGE SHELL
    ========================= */
    .page-shell {
      background: rgba(15, 23, 42, 0.28);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 1.25rem .5rem;
      border-bottom: 1px solid rgba(255, 255, 255, .05);
    }

    .nav {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      color: #fff;
    }

    .brand strong { color: #fff; }

    .brand small { color: rgba(226, 232, 240, .7); }

    .brand a {
      color: #fbbf24;
      text-decoration: none;
      font-size: .75rem;
    }

    .header-right {
      display: flex;
      gap: .6rem;
      align-items: center;
    }

    .user-chip {
      font-size: .7rem;
      color: rgba(226, 232, 240, .85);
    }

    .btn {
      background: linear-gradient(120deg, #f97316, #fbbf24);
      color: #020617;
      border: none;
      border-radius: .6rem;
      padding: .35rem .7rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform .15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 2.0rem 1.25rem 3rem;
      color: #fff;
      width: 100%;
    }

    .materials-layout {
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
      width: 100%;
    }

    /* =========================
       LEFT SIDEBAR (DESKTOP DEFAULT)
    ========================= */
    .modules-sidebar {
      width: 230px;
      max-width: 260px;
      background: rgba(15, 23, 42, .78);
      border-radius: .9rem;
      padding: .85rem .8rem;
      border: 1px solid rgba(251, 191, 36, .35);
    }

    .sidebar-title {
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: rgba(251, 191, 36, .9);
      margin: 0 0 .5rem;
    }

    /* Desktop: column list */
    .module-nav-list {
      display: flex;
      flex-direction: column;
      gap: .35rem;
    }

    .module-nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .45rem .6rem;
      border-radius: .65rem;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .14);
      color: #e2e8f0;
      font-size: .8rem;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease, color .15s ease;
    }

    .module-nav-item:hover {
      background: rgba(255, 255, 255, .14);
    }

    /* You are in this module */
    .module-nav-item.active {
      background: #16a34a;
      border-color: #86efac;
      color: #fff;
      font-weight: 800;
    }

    /* Finished, but not the one open */
    .module-nav-item.completed:not(.active) {
      background: rgba(22, 163, 74, .28);
      border-color: rgba(134, 239, 172, .55);
      color: #dcfce7;
    }

    .module-nav-item.locked {
      opacity: .45;
      background: rgba(15, 23, 42, .55);
      border-color: rgba(148, 163, 184, .25);
      color: #94a3b8;
    }

    .module-nav-item.locked:hover {
      opacity: .6;
      background: rgba(15, 23, 42, .55);
    }

    .class-item.locked {
      opacity: .45;
      cursor: pointer;
    }

    .class-item.locked:hover {
      opacity: .6;
    }

    .notice-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, .62);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2100;
      padding: 1rem;
    }

    .notice-box {
      background: #0f172a;
      border: 1px solid rgba(251, 191, 36, .35);
      border-radius: 1rem;
      padding: 1.1rem 1.15rem 1rem;
      max-width: 420px;
      width: 100%;
      color: #fff;
      box-shadow: 0 18px 40px rgba(0,0,0,.35);
    }

    .notice-box h3 {
      margin: 0 0 .45rem;
      font-size: 1.05rem;
    }

    .notice-box p {
      margin: 0 0 1rem;
      color: rgba(226, 232, 240, .85);
      font-size: .9rem;
      line-height: 1.4;
    }

    .notice-actions {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
    }

    .module-nav-label { font-weight: 500; }

    .module-nav-status {
      font-size: .7rem;
      opacity: .9;
    }

    /* =========================
       RIGHT CONTENT
    ========================= */
    .module-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 100%;
    }

    .muted { color: rgba(226, 232, 240, .8); }

    #moduleDetail {
      display: grid;
      gap: .75rem;
    }

    .classroom-card {
      background: #fff;
      color: #0f172a;
      border-radius: 1.15rem;
      padding: 1.15rem 1.2rem 1.25rem;
      box-shadow: 0 16px 40px rgba(15, 23, 42, .18);
    }
    .continue-label {
      color: #d97706;
      font-weight: 800;
      font-size: .78rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: .35rem;
    }
    .classroom-card h2 {
      margin: 0;
      font-size: clamp(1.25rem, 3vw, 1.85rem);
      color: #1e3a8a;
      line-height: 1.2;
    }
    .class-meta {
      margin-top: .35rem;
      color: #64748b;
      font-size: .92rem;
    }
    .progress-track {
      height: 6px;
      background: #e2e8f0;
      border-radius: 99px;
      margin: .85rem 0 1rem;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #f97316);
      border-radius: 99px;
    }
    .board {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: .9rem;
      overflow: hidden;
      background: #0f172a;
      cursor: pointer;
    }
    .board img, .board .board-fallback {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .board-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: linear-gradient(160deg, #1e3a8a, #3b82f6);
      font-weight: 700;
    }
    .play-fab {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, .28);
    }
    .play-fab span {
      width: 64px;
      height: 64px;
      border-radius: 999px;
      background: rgba(15, 23, 42, .82);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }
    .cta {
      display: block;
      width: 100%;
      margin-top: 1rem;
      border: none;
      border-radius: 999px;
      padding: .85rem 1rem;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      background: linear-gradient(120deg, #f97316, #fbbf24);
      color: #111827;
      font-family: inherit;
    }
    .cta:disabled {
      background: #94a3b8;
      color: #fff;
      cursor: not-allowed;
    }
    .stepper {
      display: flex;
      gap: .5rem;
      margin-top: 1.1rem;
      flex-wrap: wrap;
    }
    .step {
      flex: 1;
      min-width: 6.5rem;
      text-align: center;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      cursor: pointer;
      color: #475569;
      font-weight: 700;
      font-family: inherit;
      font-size: .82rem;
      padding: .55rem .7rem;
    }
    .step.done {
      background: #e2e8f0;
      color: #334155;
      border-color: #cbd5e1;
    }
    .step.current {
      background: #fff;
      color: #b45309;
      border: 2px solid #f5b942;
    }
    .step.locked { opacity: .55; }
    .class-status {
      margin-top: .85rem;
      font-weight: 700;
      color: #334155;
      font-size: .95rem;
    }


    .module-header-main {
      margin-bottom: .25rem;
    }

    .module-header-main h2 {
      margin: 0;
      font-size: 1.15rem;
    }

    .module-subnote {
      font-size: .8rem;
      color: rgba(226, 232, 240, .7);
    }

    .activate-panel { display: none !important; }

    .class-list {
      display: grid;
      gap: .45rem;
    }

    .class-item {
      background: rgba(15, 23, 42, .35);
      border: 1px solid rgba(255, 255, 255, .015);
      border-radius: .5rem;
      padding: .4rem .45rem .35rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .6rem;
      width: 100%;
      max-width: 100%;
    }

    .class-item.completed {
      background: rgba(22, 163, 74, .22);
      border: 1px solid rgba(22, 163, 74, .3);
    }

    .class-title {
      font-size: .8rem;
      min-width: 0;
    }

    .class-actions {
      display: flex;
      gap: .35rem;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .small-btn {
      background: rgba(248, 250, 252, .1);
      border: 1px solid rgba(255, 255, 255, .05);
      border-radius: .4rem;
      padding: .2rem .55rem;
      font-size: .68rem;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      font-family: system-ui, sans-serif;
    }

    .small-btn:hover {
      background: rgba(248, 250, 252, .2);
    }

    .small-btn:disabled,
    .small-btn.disabled {
      opacity: .45;
      cursor: not-allowed;
      background: rgba(148, 163, 184, .10);
      border-color: rgba(148, 163, 184, .18);
    }

    .small-btn:disabled:hover,
    .small-btn.disabled:hover {
      background: rgba(148, 163, 184, .10);
    }

    .small-btn.test-ready {
      background: rgba(34, 197, 94, .20);
      border: 1px solid rgba(34, 197, 94, .45);
    }

    .small-btn.test-ready:hover {
      background: rgba(34, 197, 94, .30);
    }

    .small-btn.test-passed {
      background: rgba(34, 197, 94, .28);
      border: 1px solid rgba(34, 197, 94, .55);
    }

    .lock { font-size: .8rem; opacity: .9; }

    footer {
      text-align: center;
      padding: 1.5rem 1.25rem 2.2rem;
      color: rgba(226, 232, 240, .55);
      font-size: .73rem;
      margin-top: auto;
    }

    footer .footer-btn {
      display: inline-block;
      margin-bottom: .6rem;
      background: linear-gradient(120deg, #f97316, #fbbf24);
      color: #020617;
      border-radius: .6rem;
      padding: .45rem .95rem;
      text-decoration: none;
      font-weight: 600;
    }

    #resetProgress { display: none !important; }

    /* =========================
       VIDEO MODAL
    ========================= */
    .video-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 1rem;
    }

    .video-modal {
      background: #020617;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 1rem;
      max-width: 960px;
      width: min(960px, 100%);
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
    }

    .video-modal iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-modal-close {
      position: absolute;
      top: .5rem;
      right: .5rem;
      background: rgba(15, 23, 42, .8);
      border: 1px solid rgba(255, 255, 255, .2);
      color: #fff;
      border-radius: 999px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    /* <= 840px: stack layout + turn sidebar into swipe strip */
    @media (max-width: 840px) {
      /* stop any accidental page width forcing */
      body { overflow-x: hidden; }

      main { padding: 1.75rem 1rem 2.5rem; }

      .materials-layout {
        flex-direction: column;
      }

      .modules-sidebar {
        width: 100%;
        max-width: 100%;
        overflow: hidden; /* keeps swipe inside */
        padding: .7rem .7rem;
      }

      .sidebar-title { margin-bottom: .6rem; }

      /* MOBILE STRIP */
      .module-nav-list {
        flex-direction: row;
        flex-wrap: nowrap;
        gap: .5rem;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        padding-bottom: .35rem;
        scrollbar-width: none; /* Firefox */
      }

      .module-nav-list::-webkit-scrollbar { display: none; }

      .module-nav-item {
        flex: 0 0 auto;
        min-width: 120px;
        justify-content: center;
        gap: .4rem;
        padding: .45rem .65rem;
        border-radius: 999px;
        font-size: .78rem;
        white-space: nowrap;
      }

      .module-nav-status { display: none; }
    }

    /* <= 520px: tighten header + make class rows truly fit */
    @media (max-width: 520px) {
      header { padding: 1rem .75rem .5rem; }
      main { padding: 1.25rem .75rem 2rem; }

      .nav {
        flex-wrap: wrap;
        align-items: flex-start;
        gap: .75rem;
        max-width: 100%;
      }

      .header-right {
        width: 100%;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: .5rem;
      }

      .user-chip {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .class-item {
        flex-direction: column;
        align-items: stretch;
      }

      .class-actions {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: .35rem;
      }

      .small-btn {
        width: 100%;
        text-align: center;
        padding: .45rem .7rem;
        font-size: .78rem;
        border-radius: .55rem;
        white-space: normal; /* prevents forcing width */
      }

      .class-title {
        width: 100%;
        font-size: .9rem;
      }
    }
  </style>
</head>

<body>
  <div class="page-shell">
    <header>
      <div class="nav">
        <div class="brand">
          <strong>La Escuela del Espíritu Santo</strong><br />
          <small>Ministerio Yo Soy La Vid Verdadera</small><br />
          <a href="https://iattv.org" target="_blank">IATTV.ORG</a>
        </div>

        <div class="header-right">
          <a href="./index.html" class="btn"
            style="background: rgba(255,255,255,.10); color:#fff; border:1px solid rgba(255,255,255,.12);">
            Volver al inicio
          </a>

          <span id="userEmail" class="user-chip"></span>

          <button id="logoutBtn" class="btn" type="button">Cerrar sesión</button>
        </div>
      </div>
    </header>

    <main>
      <div class="materials-layout">
        <aside class="modules-sidebar">
          <h2 class="sidebar-title">Módulos</h2>
          <div id="modulesSidebar" class="module-nav-list"></div>
        </aside>

        <section class="module-content">
          <div>
            <div id="loadingMsg" class="muted">Cargando tu clase…</div>
          </div>

          <div id="moduleDetail"></div>
        </section>
      </div>
    </main>

    <footer>
      <a class="footer-btn" href="./contacto.html">Contáctanos</a><br />
      © <span id="year"></span> La Escuela del Espíritu Santo – Ministerio Yo Soy La Vid Verdadera
    </footer>
  </div>

  <div class="notice-backdrop" id="noticeModal">
    <div class="notice-box">
      <h3 id="noticeTitle">Aún no disponible</h3>
      <p id="noticeText"></p>
      <div class="notice-actions">
        <button type="button" class="btn" id="noticeOkBtn">Entendido</button>
        <button type="button" class="btn" id="noticePayBtn" style="display:none;">Pagar este módulo</button>
      </div>
    </div>
  </div>

  <div class="video-modal-backdrop" id="videoModal">
    <div class="video-modal">
      <button class="video-modal-close" id="closeModalBtn">×</button>
      <iframe id="videoFrame" src=""
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen></iframe>
    </div>
  </div>

  <script type="module">
    document.getElementById('year').textContent = new Date().getFullYear();

    const IS_DEV = false;

    const userEmailSpan = document.getElementById("userEmail");
    const logoutBtn = document.getElementById("logoutBtn");
    const modulesSidebar = document.getElementById("modulesSidebar");
    const moduleDetail = document.getElementById("moduleDetail");
    const loadingMsg = document.getElementById("loadingMsg");
    const videoModal = document.getElementById("videoModal");
    const videoFrame = document.getElementById("videoFrame");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const noticeModal = document.getElementById("noticeModal");
    const noticeTitle = document.getElementById("noticeTitle");
    const noticeText = document.getElementById("noticeText");
    const noticeOkBtn = document.getElementById("noticeOkBtn");
    const noticePayBtn = document.getElementById("noticePayBtn");

    let noticePayModule = null;

    function showNotice(text, opts = {}) {
      noticeTitle.textContent = opts.title || "Aún no disponible";
      noticeText.textContent = text;
      noticePayModule = opts.payModule || null;
      noticePayBtn.style.display = noticePayModule ? "inline-block" : "none";
      noticeModal.style.display = "flex";
    }

    function hideNotice() {
      noticeModal.style.display = "none";
      noticePayModule = null;
    }

    noticeOkBtn?.addEventListener("click", hideNotice);
    noticeModal?.addEventListener("click", (e) => {
      if (e.target === noticeModal) hideNotice();
    });
    noticePayBtn?.addEventListener("click", () => {
      if (noticePayModule) goToPayment(noticePayModule);
    });

    function canPayModule(progress, mIndex) {
      mIndex = Number(mIndex);
      if (mIndex <= 1) return !progress.paidModules[mIndex];
      return isModuleFullyCompleted(progress, mIndex - 1) && !progress.paidModules[mIndex];
    }

    function lockedModuleMessage(progress, mIndex) {
      if (mIndex <= 1) {
        return "Empieza por el Módulo 1. Mira la clase y luego toma la prueba.";
      }
      if (!isModuleFullyCompleted(progress, mIndex - 1)) {
        return `Primero termina todas las pruebas del Módulo ${mIndex - 1}. Después podrás pagar y ver el Módulo ${mIndex}.`;
      }
      if (!progress.paidModules[mIndex]) {
        return `Ya completaste el módulo anterior. Para ver el Módulo ${mIndex} primero debes pagarlo.`;
      }
      return `El Módulo ${mIndex} se abrirá cuando completes el anterior.`;
    }

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import { FIREBASE_CONFIG } from "./js/firebase-config.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      collection,
      getDocs,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

    const firebaseConfig = FIREBASE_CONFIG;

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let currentProgress = null;

    // modulesData:
    // [
    //   { id, title, order, price, classes:[{id,title,order,videoUrl}] , _index }
    // ]
    let modulesData = [];
    let selectedModuleIndex = 1;   // 1..N
    let selectedClassIndex = 1;    // 1..N within module
    let currentVideoKey = null;    // "m-c" like "1-1"

    // Optional fallback prices (only used if module.price missing)
    const modulePricesFallback = { 1: 25, 2: 25, 3: 25, 4: 25, 5: 30, 6: 30 };

    function emptyProgress() {
      return {
        paidModules: {},
        paymentPending: {},
        passedTests: {},
        videoWatched: {}
      };
    }

    async function loadProgress(uid) {
      const ref = doc(db, "userProgress", uid);
      const snap = await getDoc(ref);
      if (snap.exists()) {
        const data = snap.data();
        if (!data.paidModules) data.paidModules = {};
        if (!data.paymentPending) data.paymentPending = {};
        if (!data.passedTests) data.passedTests = {};
        if (!data.videoWatched) data.videoWatched = {};
        return data;
      }
      const base = emptyProgress();
      await setDoc(ref, base);
      return base;
    }

    async function saveProgress(uid, data) {
      await setDoc(doc(db, "userProgress", uid), data, { merge: true });
    }

    async function loadModulesFromFirestore() {
      let modsSnap;
      try {
        modsSnap = await getDocs(query(collection(db, "modules"), orderBy("order", "asc")));
      } catch (e) {
        modsSnap = await getDocs(collection(db, "modules"));
      }

      const mods = [];

      for (const modDoc of modsSnap.docs) {
        const mod = { id: modDoc.id, ...modDoc.data(), classes: [] };

        let classesSnap;
        try {
          classesSnap = await getDocs(
            query(collection(db, "modules", modDoc.id, "classes"), orderBy("order", "asc"))
          );
        } catch (e) {
          classesSnap = await getDocs(collection(db, "modules", modDoc.id, "classes"));
        }

        mod.classes = classesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        mods.push(mod);
      }

      mods.sort((a, b) => (Number(a.order) || 9999) - (Number(b.order) || 9999));
      mods.forEach((m, idx) => {
        m._index = idx + 1;
        if (!Array.isArray(m.classes)) m.classes = [];
        m.classes.sort((a, b) => (Number(a.order) || 9999) - (Number(b.order) || 9999));
        m.classes.forEach((c, cIdx) => c._index = cIdx + 1);
      });

      modulesData = mods;
    }

    function getModuleByIndex(mIndex) {
      return modulesData.find(m => m._index === Number(mIndex)) || null;
    }

    function getClassByKey(key) {
      const [mStr, cStr] = String(key).split("-");
      const mIndex = Number(mStr);
      const cIndex = Number(cStr);
      const mod = getModuleByIndex(mIndex);
      if (!mod) return null;
      return mod.classes.find(c => c._index === cIndex) || null;
    }

    function classKey(mIndex, cIndex) {
      return `${Number(mIndex)}-${Number(cIndex)}`;
    }

    function isModuleUnlocked(progress, mIndex) {
      mIndex = Number(mIndex);
      if (mIndex === 1) return true;

      const prev = getModuleByIndex(mIndex - 1);
      if (!prev) return false;

      for (const cls of prev.classes) {
        const key = classKey(mIndex - 1, cls._index);
        if (!progress.passedTests[key]) return false;
      }
      return true;
    }

    function isModuleFullyCompleted(progress, mIndex) {
      const mod = getModuleByIndex(mIndex);
      if (!mod) return false;
      if (!mod.classes || mod.classes.length === 0) return false;

      for (const cls of mod.classes) {
        const key = classKey(mIndex, cls._index);
        if (!progress.passedTests[key]) return false;
      }
      return true;
    }

    function isClassUnlocked(progress, mIndex, cIndex) {
      mIndex = Number(mIndex);
      cIndex = Number(cIndex);

      // Must be paid before ANY class video
      if (!progress.paidModules[mIndex]) return false;

      // Must be sequential
      if (cIndex === 1) return true;
      return !!progress.passedTests[classKey(mIndex, cIndex - 1)];
    }

    function getActiveModuleIndex(progress) {
      for (const mod of modulesData) {
        const mIndex = mod._index;
        if (isModuleUnlocked(progress, mIndex) && !isModuleFullyCompleted(progress, mIndex)) {
          return mIndex;
        }
      }
      return modulesData.length ? modulesData[modulesData.length - 1]._index : 1;
    }

    // ✅ mIndex is 1-based here (module number). Keep it simple and consistent.
    function goToPayment(mIndex) {
      const moduleNumber = Number(mIndex);
      window.location.href = `./pago.html?m=${encodeURIComponent(moduleNumber)}`;
    }
    window.goToPayment = goToPayment;


    function youtubeId(url) {
      const raw = String(url || "").trim();
      try {
        const u = new URL(raw);
        if (u.hostname.includes("youtu.be")) return u.pathname.replace("/", "").trim();
        const v = u.searchParams.get("v");
        if (v) return v;
        const parts = u.pathname.split("/").filter(Boolean);
        const i = parts.indexOf("embed");
        if (i !== -1 && parts[i + 1]) return parts[i + 1];
        const s = parts.indexOf("shorts");
        if (s !== -1 && parts[s + 1]) return parts[s + 1];
      } catch (e) {}
      return "";
    }

    function getResumeClassIndex(progress, mIndex) {
      const mod = getModuleByIndex(mIndex);
      if (!mod || !mod.classes.length) return 1;
      for (const cls of mod.classes) {
        const key = classKey(mIndex, cls._index);
        if (!progress.passedTests[key]) return cls._index;
      }
      return mod.classes[mod.classes.length - 1]._index;
    }

    function nextUnpaidModule(progress) {
      for (const mod of modulesData) {
        const i = mod._index;
        if (isModuleFullyCompleted(progress, i - 1 || 1) === false && i > 1) continue;
        if (!progress.paidModules[i] && canPayModule(progress, i)) return i;
      }
      return null;
    }

    function renderSidebar() {
      modulesSidebar.innerHTML = "";
      const p = currentProgress;

      for (const mod of modulesData) {
        const mIndex = mod._index;
        const unlocked = isModuleUnlocked(p, mIndex);
        const completed = isModuleFullyCompleted(p, mIndex);

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "module-nav-item";
        if (completed) btn.classList.add("completed");
        if (!unlocked) btn.classList.add("locked");
        if (mIndex === selectedModuleIndex) btn.classList.add("active");

        const status = mIndex === selectedModuleIndex
          ? "Aquí"
          : completed ? "✓"
          : !unlocked ? "🔒"
          : "";
        btn.innerHTML = `
          <span class="module-nav-label">Módulo ${mIndex}</span>
          <span class="module-nav-status">${status}</span>
        `;

        btn.addEventListener("click", () => {
          if (!unlocked) {
            showNotice(lockedModuleMessage(p, mIndex));
            return;
          }
          selectedModuleIndex = mIndex;
          selectedClassIndex = getResumeClassIndex(p, mIndex);
          renderAll();
        });

        modulesSidebar.appendChild(btn);
      }
    }

    function renderModuleDetail(mIndex) {
      const p = currentProgress;
      const mod = getModuleByIndex(mIndex);

      if (!mod) {
        moduleDetail.innerHTML = `
          <div class="classroom-card">
            <h2>No hay módulos disponibles</h2>
            <div class="class-meta">Aún no se han creado módulos en el sistema.</div>
          </div>
        `;
        return;
      }

      const classes = mod.classes || [];
      if (!classes.length) {
        moduleDetail.innerHTML = `
          <div class="classroom-card">
            <div class="continue-label">Módulo ${mIndex}</div>
            <h2>${mod.title || ("Módulo " + mIndex)}</h2>
            <div class="class-meta">Este módulo todavía no tiene clases.</div>
          </div>
        `;
        return;
      }

      if (!classes.some(c => c._index === selectedClassIndex)) {
        selectedClassIndex = getResumeClassIndex(p, mIndex);
      }

      const cls = classes.find(c => c._index === selectedClassIndex) || classes[0];
      const cIndex = cls._index;
      const key = classKey(mIndex, cIndex);
      const total = classes.length;
      const passed = !!p.passedTests[key];
      const watched = !!p.videoWatched[key];
      const moduleUnlocked = isModuleUnlocked(p, mIndex);
      const modulePaid = !!p.paidModules[mIndex];
      const unlockedClass = modulePaid && isClassUnlocked(p, mIndex, cIndex);
      const title = (cls.title && String(cls.title).trim()) ? cls.title : `Clase ${cIndex}`;
      const passedCount = classes.filter(c => p.passedTests[classKey(mIndex, c._index)]).length;
      const pct = Math.round((passedCount / total) * 100);
      const yt = youtubeId(cls.videoUrl);
      const thumb = yt ? `https://img.youtube.com/vi/${yt}/hqdefault.jpg` : "";

      let ctaLabel = "Ver clase";
      let ctaAction = "video";
      let boardAction = "video";
      let lockMsg = "";

      if (!moduleUnlocked) {
        ctaLabel = "Aún no disponible";
        ctaAction = "locked";
        boardAction = "locked";
        lockMsg = lockedModuleMessage(p, mIndex);
      } else if (!modulePaid) {
        ctaLabel = "Continuar al pago";
        ctaAction = "pay";
        boardAction = "pay";
      } else if (!unlockedClass) {
        ctaLabel = "Aún no disponible";
        ctaAction = "locked";
        boardAction = "locked";
        lockMsg = "Primero aprueba la prueba de la clase anterior.";
      } else if (!watched && !passed) {
        ctaLabel = "Ver clase";
        ctaAction = "video";
        boardAction = "video";
      } else if (watched && !passed) {
        ctaLabel = "Tomar la prueba";
        ctaAction = "test";
        boardAction = "video";
      } else if (passed) {
        ctaLabel = "";
        ctaAction = "";
        boardAction = "video";
      }

      const steps = classes.map(c => {
        const k = classKey(mIndex, c._index);
        const done = !!p.passedTests[k];
        const cur = c._index === cIndex;
        const extra = (!modulePaid || !isClassUnlocked(p, mIndex, c._index)) && !done ? " locked" : "";
        let word = "Pendiente";
        if (done) word = "Completada";
        else if (cur) word = "En curso";
        const label = `${c._index} ${word}`;
        return `<button type="button" class="step ${done ? "done" : ""} ${cur ? "current" : ""} ${extra}" data-step="${c._index}">${label}</button>`;
      }).join("");

      const boardInner = thumb
        ? `<img src="${thumb}" alt="">`
        : `<div class="board-fallback">Clase ${cIndex}</div>`;

      const moduleDone = isModuleFullyCompleted(p, mIndex);
      const statusLine = moduleDone
        ? `<div class="class-status">Felicitaciones. Completaste este módulo.</div>`
        : passed
          ? `<div class="class-status">Esta clase ya está aprobada.</div>`
          : watched
            ? `<div class="class-status">Pendiente: presentar la prueba.</div>`
            : `<div class="class-status">Pendiente: ver la clase.</div>`;
      const ctaHtml = ctaLabel
        ? `<button type="button" class="cta" id="classCta">${ctaLabel}</button>`
        : "";

      moduleDetail.innerHTML = `
        <div class="classroom-card">
          <div class="continue-label">Continúa aquí</div>
          <h2>${title}</h2>
          <div class="class-meta">Módulo ${mIndex}${mod.title ? " · " + mod.title : ""} · Clase ${cIndex} de ${total}</div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="board" id="classBoard">${boardInner}<div class="play-fab"><span>▶</span></div></div>
          ${statusLine}
          ${ctaHtml}
          <div class="stepper">${steps}</div>
        </div>
      `;

      const runAction = (action) => {
        if (action === "locked") return showNotice(lockMsg || lockedModuleMessage(p, mIndex));
        if (action === "pay") return goToPayment(mIndex);
        if (action === "pay-next") return goToPayment(mIndex + 1);
        if (action === "video") return openVideoModal(key);
        if (action === "test") return openTestPage(key);
        if (action === "next-class") {
          selectedClassIndex = cIndex + 1;
          renderAll();
        }
      };

      document.getElementById("classBoard")?.addEventListener("click", () => runAction(boardAction));
      document.getElementById("classCta")?.addEventListener("click", () => runAction(ctaAction));
      moduleDetail.querySelectorAll("[data-step]").forEach(btn => {
        btn.addEventListener("click", () => {
          const n = Number(btn.getAttribute("data-step"));
          const k = classKey(mIndex, n);
          if (!moduleUnlocked) return showNotice(lockedModuleMessage(p, mIndex));
          if (!modulePaid) return goToPayment(mIndex);
          if (!isClassUnlocked(p, mIndex, n) && !p.passedTests[k]) {
            return showNotice("Primero aprueba la prueba de la clase anterior.");
          }
          selectedClassIndex = n;
          renderAll();
        });
      });
    }

    function renderAll() {
      loadingMsg.style.display = "none";

      if (!modulesData || modulesData.length === 0) {
        renderSidebar();
        moduleDetail.innerHTML = `
          <div class="module-header-main">
            <h2>No hay módulos disponibles</h2>
            <div class="module-subnote">Aún no se han creado módulos en el sistema.</div>
          </div>
        `;
        return;
      }

      if (!isModuleUnlocked(currentProgress, selectedModuleIndex)) {
        selectedModuleIndex = getActiveModuleIndex(currentProgress);
      }
      if (!selectedClassIndex) {
        selectedClassIndex = getResumeClassIndex(currentProgress, selectedModuleIndex);
      }

      renderSidebar();
      renderModuleDetail(selectedModuleIndex);
    }

    function openTestPage(key) {
      const [m, c] = String(key).split("-");
      window.location.href = `test.html?m=${encodeURIComponent(m)}&c=${encodeURIComponent(c)}`;
    }
    window.openTestPage = openTestPage;

    function toYouTubeEmbedUrl(url) {
      const raw = String(url || "").trim();
      if (raw.includes("youtube.com/embed/")) return raw;

      try {
        const u = new URL(raw);

        if (u.hostname.includes("youtu.be")) {
          const id = u.pathname.replace("/", "").trim();
          return `https://www.youtube.com/embed/${id}`;
        }

        const v = u.searchParams.get("v");
        if (v) return `https://www.youtube.com/embed/${v}`;

        const parts = u.pathname.split("/").filter(Boolean);

        const idxShorts = parts.indexOf("shorts");
        if (idxShorts !== -1 && parts[idxShorts + 1]) {
          return `https://www.youtube.com/embed/${parts[idxShorts + 1]}`;
        }

        const idxLive = parts.indexOf("live");
        if (idxLive !== -1 && parts[idxLive + 1]) {
          return `https://www.youtube.com/embed/${parts[idxLive + 1]}`;
        }
      } catch (e) { }

      return raw;
    }

    function openVideoModal(classKeyStr) {
      const cls = getClassByKey(classKeyStr);
      if (!cls) return alert("Esta clase no existe.");

      const url = cls.videoUrl;
      if (!url) return alert("Esta clase no tiene video.");

      currentVideoKey = classKeyStr;
      const embed = toYouTubeEmbedUrl(url);
      videoFrame.src = embed
        ? `${embed}?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1`
        : "";
      videoModal.style.display = "flex";
    }
    window.openVideoModal = openVideoModal;

    async function closeVideoModalReal() {
      videoModal.style.display = "none";
      videoFrame.src = "";

      if (currentVideoKey) {
        currentProgress.videoWatched[currentVideoKey] = true;
        await saveProgress(currentUser.uid, currentProgress);

        currentVideoKey = null;

        renderAll();
        showNotice("La clase quedó marcada como vista. Ahora puedes tomar la prueba.", { title: "Clase vista" });
      }
    }

    closeModalBtn.addEventListener("click", closeVideoModalReal);
    videoModal.addEventListener("click", (e) => {
      if (e.target === videoModal) closeVideoModalReal();
    });

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "./login.html";
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "./login.html";
        return;
      }
      currentUser = user;
      userEmailSpan.textContent = user.email;

      loadingMsg.style.display = "block";
      loadingMsg.textContent = "Cargando tus módulos…";

      await loadModulesFromFirestore();
      currentProgress = await loadProgress(user.uid);

      const wantM = Number(new URLSearchParams(location.search).get("m") || 0);
      const wantC = Number(new URLSearchParams(location.search).get("c") || 0);
      selectedModuleIndex = wantM || getActiveModuleIndex(currentProgress);
      selectedClassIndex = wantC || getResumeClassIndex(currentProgress, selectedModuleIndex);

      renderAll();
    });

    if (IS_DEV) {
      console.warn("DEV MODE ACTIVE");
    }
  </script>
</body>

</html>
